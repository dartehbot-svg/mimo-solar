name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build bot
        working-directory: bot
        run: |
          npm ci
          npm run build

      - name: Create archive
        run: |
          tar -czf solar-${{ github.ref_name }}.tar.gz \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='*.pyc' \
            --exclude='desktop' \
            core/ \
            bot/ \
            swe/ \
            ecosystem.config.js

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: solar-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
